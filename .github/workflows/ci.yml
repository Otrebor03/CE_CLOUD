name: CI Validar y Testear

on:
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'          

      - name: Instalar dependencias
        working-directory: ./Despliegues_Servicios/Tema 1 - Introduccion/prac1cicd
        run: npm ci

      - name: Validar HTML (html-validate)
        working-directory: ./Despliegues_Servicios/Tema 1 - Introduccion/prac1cicd
        run: npx html-validate index.html
      
      - name: Validar CSS (w3c-validate-css)
        working-directory: ./Despliegues_Servicios/Tema 1 - Introduccion/prac1cicd
        run: npx w3c-validate-css --target css/style.css
