name: CI Validar y Testear

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'          

      - name: Instalar dependencias
        working-directory: ./Despliegues_Servicios/Tema 1 - Introduccion/Practica 1/Proyecto/despliegue
        run: npm ci

      - name: Validar HTML (html-validate)
        working-directory: ./Despliegues_Servicios/Tema 1 - Introduccion/Practica 1/Proyecto/despliegue
        run: npx html-validate index.html
    
      - name: Linting CSS (stylelint)
        working-directory: ./Despliegues_Servicios/Tema 1 - Introduccion/Practica 1/Proyecto/despliegue
        run: npx stylelint "css/**/*.css"

      - name: Linting JavaScript (eslint)
        working-directory: ./Despliegues_Servicios/Tema 1 - Introduccion/Practica 1/Proyecto/despliegue
        run: npx eslint js/